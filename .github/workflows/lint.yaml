name: Lint

on:
  pull_request:
    branches:
      - main

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/setup@v1
        with:
          version: 11
          runtime: node@22
          cache: true

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
      - run: pnpm install
      - run: pnpm lint
